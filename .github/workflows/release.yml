name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example, v0.6.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert re.fullmatch(r'\d+\.\d+(?:\.\d+)?', version), 'Use a vX.Y or vX.Y.Z release tag'
          plugin = Path('remote_turner.koplugin/_meta.lua').read_text()
          project = Path('KOReaderiOSRemote.xcodeproj/project.pbxproj').read_text()
          assert re.search(r'version = "([^"]+)"', plugin).group(1) == version, 'Update the plugin version'
          assert set(re.findall(r'MARKETING_VERSION = ([^;]+);', project)) == {version}, 'Update all app versions'
          PY
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - run: luacheck remote_turner.koplugin/ tests/
      - run: make test-plugin LUA=lua5.1
      - name: Package plugin
        run: python3 scripts/package-plugin.py "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*.zip
          if-no-files-found: error

  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: xcrun swift test --package-path Packages/RemoteCore
      - name: Build unsigned AltStore Classic IPA
        run: ./scripts/build-altstore-ipa.sh "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    needs: [plugin, ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Record checksums
        working-directory: dist
        run: sha256sum *.zip *.ipa > SHA256SUMS
      - name: Publish labeled release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/publish-release.sh "$RELEASE_TAG"
