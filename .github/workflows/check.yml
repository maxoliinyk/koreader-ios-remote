name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test every distribution configuration
        run: ./scripts/check-distributions.sh
      - name: Launch every iPhone configuration
        env:
          INTERACTIVE_SIMULATOR: 0
          SKIP_WATCH: 1
        run: ./scripts/smoke-simulator.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua-check zip
      - run: luacheck remote_turner.koplugin/
      - run: make koplugin VERSION=ci
      - uses: actions/upload-artifact@v4
        with:
          name: remote-turner-plugin
          path: dist/*.zip
