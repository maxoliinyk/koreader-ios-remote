name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test every distribution configuration
        run: ./scripts/check-distributions.sh
      - name: Launch every iPhone configuration
        env:
          INTERACTIVE_SIMULATOR: 0
          SKIP_WATCH: 1
        run: ./scripts/smoke-simulator.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - run: luacheck remote_turner.koplugin/ tests/
      - run: make test-plugin LUA=lua5.1
      - run: make koplugin VERSION=ci
      - uses: actions/upload-artifact@v4
        with:
          name: remote-turner-plugin
          path: dist/*.zip
